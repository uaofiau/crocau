name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # Go 1.20 - последний Go, работающий на Windows 7. croc v10.0.12 - последняя версия croc, собираемая Go 1.20.
  GO_VERSION: '1.20'
  CROC_VERSION: v10.0.12

jobs:
  build-win32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve modules
        shell: bash
        run: |
          set +e
          {
            go version
            go get github.com/lxn/walk@latest github.com/lxn/win@latest github.com/schollz/croc/v10@${CROC_VERSION}
            go mod tidy
          } > mod.log 2>&1
          rc=$?
          cat mod.log
          if [ $rc -ne 0 ]; then
            msg=$(python3 -c "print(open('mod.log').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            echo "::error title=modules::$msg"
            exit 1
          fi

      - name: Windows manifest resource
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -manifest crocau.manifest -ico assets/crocau.ico -arch 386 -o rsrc_windows_386.syso

      - name: Build crocau.exe (windows/386, Go 1.20)
        shell: bash
        run: |
          set +e
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -ldflags "-s -w -H windowsgui" -o crocau.exe . > build.log 2>&1
          rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then
            msg=$(python3 -c "print(open('build.log').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            echo "::error title=build::$msg"
            exit 1
          fi
          ls -la crocau.exe

      - uses: actions/upload-artifact@v4
        with:
          name: crocau-win32
          path: crocau.exe

  test-win:
    needs: build-win32
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crocau-win32
      - name: PE header check (must be 32-bit i386, GUI subsystem)
        shell: powershell
        run: |
          $b = [IO.File]::ReadAllBytes("$PWD\crocau.exe")
          $pe = [BitConverter]::ToInt32($b, 60)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          "Machine = 0x{0:X}, Subsystem = {1}, Size = {2}" -f $machine, $subsystem, $b.Length
          if ($machine -ne 0x14c) { throw "not i386" }
          if ($subsystem -ne 2) { throw "not GUI subsystem" }
      - name: Self-test (relay + text/files/folder transfers, 3-char password)
        shell: powershell
        timeout-minutes: 8
        run: |
          $env:CROCAU_TESTLOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath "$PWD\crocau.exe" -ArgumentList '--selftest' -Wait -PassThru
          $out = ""
          if (Test-Path $env:CROCAU_TESTLOG) { $out = Get-Content $env:CROCAU_TESTLOG -Raw -Encoding UTF8 }
          Write-Host $out
          $msg = $out -replace "`r?`n", "%0A"
          if ($p.ExitCode -ne 0 -or $out -notmatch "SELFTEST PASSED") { Write-Host "::error title=selftest::exit=$($p.ExitCode) $msg"; exit 1 } else { Write-Host "::notice title=selftest::$msg" }
      - name: GUI test (real window, handlers called programmatically)
        shell: powershell
        timeout-minutes: 7
        run: |
          $env:CROCAU_TESTLOG = "$PWD\guitest.log"
          $p = Start-Process -FilePath "$PWD\crocau.exe" -ArgumentList '--guitest' -PassThru
          $done = $p.WaitForExit(230000)
          if ($done) { $code = $p.ExitCode } else { $code = 99 }
          Get-Process crocau -ErrorAction SilentlyContinue | Stop-Process -Force
          $out = ""
          if (Test-Path $env:CROCAU_TESTLOG) { $out = Get-Content $env:CROCAU_TESTLOG -Raw -Encoding UTF8 }
          Write-Host $out
          $msg = $out -replace "`r?`n", "%0A"
          if (Test-Path "$PWD\crocau-error.log") { $msg += "%0A" + (Get-Content "$PWD\crocau-error.log" -Raw) }
          if ($code -ne 0 -or $out -notmatch "GUITEST PASSED") { Write-Host "::error title=guitest::exit=$code $msg"; exit 1 } else { Write-Host "::notice title=guitest::$msg" }

      - name: Public relay check (informational)
        shell: powershell
        continue-on-error: true
        timeout-minutes: 4
        run: |
          $env:CROCAU_TESTLOG = "$PWD\nettest.log"
          $p = Start-Process -FilePath "$PWD\crocau.exe" -ArgumentList '--nettest' -PassThru
          $done = $p.WaitForExit(150000)
          if ($done) { $code = $p.ExitCode } else { $code = 99 }
          Get-Process crocau -ErrorAction SilentlyContinue | Stop-Process -Force
          $out = ""
          if (Test-Path $env:CROCAU_TESTLOG) { $out = Get-Content $env:CROCAU_TESTLOG -Raw -Encoding UTF8 }
          Write-Host $out
          $msg = $out -replace "`r?`n", "%0A"
          Write-Host "::notice title=nettest exit=$code::$msg"

  release:
    needs: test-win
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crocau-win32
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" crocau.exe --title "crocau $TAG" --notes "Windows 7+ (32-bit), один exe. croc $CROC_VERSION, Go $GO_VERSION." || gh release upload "$TAG" crocau.exe --clobber
          else
            gh release delete latest --cleanup-tag -y || true
            gh release create latest crocau.exe --prerelease --target "$GITHUB_SHA" --title "crocau latest ($SHORT)" --notes "Автоматическая сборка коммита $SHORT. Windows 7+ (32-bit), один exe. croc $CROC_VERSION, Go $GO_VERSION."
          fi
